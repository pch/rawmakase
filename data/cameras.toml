# RAWmakase's camera table: per-model values that are not in the raw file itself.
# See docs/cameras.md for what each field means and how to add a camera.
#
# make and model are the names RAWmakase's decoders report (`rawmakase inspect`
# prints them; data/raw-cameras.toml gives the name of a body sold under
# several); aliases are other model names for the same body.
# baseline_exposure is the exposure, in EV, Camera Raw adds to an unedited photo
# with Adobe Standard. source says where the value comes from:
#   adobe-dng      read from a DNG Adobe software wrote: BaselineExposure, which holds
#                  as RAWmakase reads Adobe's levels (see docs/cameras.md)
#   adobe-profile  read from the camera's Adobe DCP (BaselineExposureOffset tag)
#   fitted         fitted to Camera Raw renders (median midtone offset)
#   measured       measured by hand; say how in `how`
# checked is the date of the check and sample what it was checked on.
# Values hold at standard settings (no Highlight Tone Priority, DR100, no extended
# low ISO). RAWmakase moves Fujifilm rows with the raw's exposure midpoint shift
# (DR200/DR400, extended ISO) unless the row says fujifilm_exposure_shift = "ignored";
# fujifilm_dr100_shift gives the body's shift at DR100 when it is not the sensor's
# usual one (-0.72 X-Trans, 0 Bayer). lowest_iso is the body's lowest native ISO
# when extended settings lie below it, where Camera Raw takes 1 EV off (Sony 50-80).
# sraw_baseline_exposure is Adobe's BaselineExposure for the body's sRAW and mRAW
# (docs/cameras.md). levels (Canon) are the black, white and samples' maximum of the
# sample the baseline was read from: Adobe moves a Canon's BaselineExposure with the
# white it takes by ISO speed, so a photo of other levels takes the difference.

[[camera]]
make = "Canon"
model = "EOS 100D"
baseline_exposure = -0.1
levels = [2047, 12277, 16383]
unit_calibration = { preset = "daylight", reference = [2185, 1024, 1584] }
source = "adobe-dng"
checked = "2026-10-14"
sample = "raw.pixls.us, 1 photo at ISO 100; BaselineExposure -0.09"

