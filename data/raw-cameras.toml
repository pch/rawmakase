# The camera facts RAWmakase's own RAW decoders need beyond the file
# (crates/rawmakase-raw/src/facts.rs; docs/raw-decoding.md).
#
# [[name]]       a model as files write it (make as RAWmakase names it), and the
#                body it is (`is`)
# [[canonical]]  the canonical make and model of a body sold under several names,
#                which camera profiles may use
# [[camera]]     decode facts, for the camera's files matching `dng` and
#                `raw_size` when given: the visible area (`visible`, left, top,
#                width, height in sensor coordinates) and levels (`white`,
#                and `black` for every channel)
#
# source says where the values come from:
#   file             a rule from the file's own tags, for files that lack them
#   adobe-dng        Adobe DNG Converter 18.7's output for the camera
#   compat-observed  the earlier decoder's (LibRaw at 4f014403) output on the test
#                    dataset's files, kept so saved edits keep their geometry and
#                    scale (2026-10-17); never a colour matrix

