# The camera facts RAWmakase's own RAW decoders need beyond the file
# (crates/rawmakase-raw/src/facts.rs; docs/raw-decoding.md).
#
# [[name]]       a model as files write it (make as RAWmakase names it), and the
#                body it is (`is`)
# [[canonical]]  the canonical make and model of a body sold under several names,
#                which camera profiles may use
# [[camera]]     decode facts, for the camera's files matching `dng` and
#                `raw_size` when given: the visible area (`visible`, left, top,
#                width, height in sensor coordinates), levels (`white`,
#                and `black` for every channel), of its files of `bits`-bit
#                samples when given, the orientation (`flip`, RAWmakase's
#                flip code) and the default crop (`frame`, left, top, width,
#                height in sensor coordinates; 65535, 65535, 0, 0 for none),
#                and `wb_scale` (red, blue): factors the white balance levels
#                are scaled by where the maker's rules say they are
#                (Fujifilm's record 0x8200) and the file does not say by how
#                much; observed from LibRaw's output, not colour matrices;
#                and the 2 × 2 colour filter at the sensor's corner (`cfa`, 0
#                red, 1 green, 2 blue); `aspect_crop = false` where the
#                camera's aspect crop is not shown
# [[headerless]] a RAW file with no header, known by its `file_size`: the
#                camera, `raw_size`, `bits` per packed sample, the `visible`
#                area and the `cfa` at the sensor's corner, and the masked
#                columns (`black_columns`, start and end) black is measured
#                on where they are not beside the visible area
#
# source says where the values come from:
#   file             a rule from the file's own tags, for files that lack them
#   adobe-dng        Adobe DNG Converter 18.7's output for the camera: on [[camera]]
#                    rows decode facts only (`white`, `black`, `wb_scale`),
#                    never geometry (`visible`, `frame`, `flip`, `cfa`)
#   compat-observed  the earlier decoder's (LibRaw at 4f014403) output on the test
#                    dataset's files, kept so saved edits keep their geometry and
#                    scale (2026-10-17); never a colour matrix

