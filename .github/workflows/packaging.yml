name: Packaging checks

on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'native-packages.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'native-packages.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew.yml'
  # The release workflow packages its own builds here before publishing.
  workflow_call:
    inputs:
      version:
        description: Version being released (for example 0.1.9)
        type: string
        required: true
      source-artifact:
        description: Artifact holding the Linux archives and both DMGs
        type: string
        required: true

permissions:
  contents: read

# As in CI: a newer push supersedes the run in progress, while a release's
# packaging (called with a version) has its own group and is never cancelled.
concurrency:
  group: ${{ inputs.version && format('packaging-release-{0}', inputs.version) || format('packaging-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  validate:
    if: inputs.version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Validate workflows and package configuration
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$RUNNER_TEMP/tools/actionlint"
          shellcheck packaging/*.sh packaging/macos/*.sh packaging/linux/*.sh
          ruby -c packaging/macos/dmg.rb
          ruby -c packaging/macos/signing-diagnostics.rb
          python3 -m py_compile packaging/macos/*.py packaging/linux/*.py
          python3 -m unittest discover -s packaging/macos -p 'test_*.py'
          gem install native-packages --version 0.7.0 --no-document
          native-packages validate
      - name: Parse the Windows packaging scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($script.FullName)::$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  doctor-macos:
    if: inputs.version == ''
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Check the macOS packaging tools
        run: |
          gem install native-packages --version 0.7.0 --no-document
          native-packages doctor --target macos-arm64 --target macos-amd64 --defer-recipes

  # The release's Windows job, from this checkout: MSVC build, the Inno Setup
  # installer through native-packages, then a silent install and uninstall.
  windows:
    if: inputs.version == ''
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The same vcpkg cache as the CI job (see ci.yml).
      - id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ steps.image.outputs.version }}-${{ hashFiles('packaging/windows/deps.ps1') }}
      - name: LibRaw and Little CMS
        run: packaging/windows/deps.ps1 "$env:RUNNER_TEMP\deps"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and stage app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked
          packaging/windows/stage.ps1 target\release\rawmakase.exe "$env:RUNNER_TEMP\deps" dist\windows
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          gem install native-packages --version 0.7.0 --no-document
          native-packages doctor --target windows-amd64 --defer-recipes
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          native-packages build --version $version --target windows-amd64 --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
      - name: Install, run and uninstall
        run: packaging/windows/verify.ps1 "$env:RUNNER_TEMP\windows-packages\packages\windows-amd64\inno\rawmakase-v$env:VERSION-x86_64-pc-windows-msvc-setup.exe" $env:VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows-packages/packages/windows-amd64/inno/*.exe
          if-no-files-found: error

  # native-packages' shared workflow installs nfpm and builds the DEB and RPM
  # packages and the Homebrew cask. Pull requests package the published v0.1.8
  # x86_64 archive, the last release before aarch64 builds; a release packages
  # its own archives for both architectures.
  packages:
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
    with:
      targets: ${{ inputs.version != '' && 'linux-amd64,linux-arm64' || 'linux-amd64' }}
      version: ${{ inputs.version || 'v0.1.8' }}
      source-artifact: ${{ inputs.source-artifact }}
      publish: false

  install:
    name: Install on ${{ matrix.image }} (${{ matrix.platform.target }})
    needs: packages
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:13-slim, fedora:43, fedora:44]
        platform: ${{ fromJSON(inputs.version != '' && '[{"runner":"ubuntu-24.04","target":"linux-amd64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"}]' || '[{"runner":"ubuntu-24.04","target":"linux-amd64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-packages
          path: native-packages
      - name: Clean installation, runtime libraries and removal
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          mkdir packages
          cp "native-packages/packages/$TARGET/deb/"*.deb "native-packages/packages/$TARGET/rpm/"*.rpm packages/
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/packaging/linux:/checks:ro" "$IMAGE" bash /checks/verify.sh
