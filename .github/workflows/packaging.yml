name: Packaging checks

on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'native-packages.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'native-packages.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew.yml'
  # The release workflow packages its own builds here before publishing.
  workflow_call:
    inputs:
      version:
        description: Version being released (for example 0.1.9)
        type: string
        required: true
      source-artifact:
        description: Artifact holding the Linux archives and both DMGs
        type: string
        required: true

permissions:
  contents: read

# As in CI: a newer push supersedes the run in progress, while a release's
# packaging (called with a version) has its own group and is never cancelled.
concurrency:
  group: ${{ inputs.version && format('packaging-release-{0}', inputs.version) || format('packaging-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  validate:
    if: inputs.version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: '3.3'
      - name: Validate workflows and package configuration
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$RUNNER_TEMP/tools/actionlint"
          shellcheck packaging/macos/*.sh packaging/linux/*.sh
          ruby -c packaging/macos/dmg.rb
          ruby -c packaging/macos/signing-diagnostics.rb
          python3 -m py_compile packaging/macos/*.py packaging/linux/*.py
          python3 -m unittest discover -s packaging/macos -p 'test_*.py'
          python3 -m unittest discover -s packaging -p 'test_*.py'
          gem install native-packages --version 0.10.0 --no-document
          native-packages validate
      - name: Parse the Windows packaging scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($script.FullName)::$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  doctor-macos:
    if: inputs.version == ''
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: '3.3'
      - name: Check the macOS packaging tools
        run: |
          gem install native-packages --version 0.10.0 --no-document
          native-packages doctor --target macos-arm64 --target macos-amd64 --defer-recipes

  # The release's Windows job, from this checkout: MSVC build, the Inno Setup
  # installer through native-packages, then a silent install and uninstall.
  windows:
    name: windows (${{ matrix.arch }})
    if: inputs.version == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # As in release.yml: each architecture builds natively.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            target: windows-amd64
            ruby: '3.3'
          - runner: windows-11-arm
            arch: aarch64
            target: windows-arm64
            ruby: '3.4'
    # runs-on is a matrix expression, so name the shell Windows uses by default
    # (and tell actionlint these steps are PowerShell).
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build tools
        run: packaging/windows/toolchain.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and stage app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked
          packaging/windows/stage.ps1 target\release\rawmakase.exe dist\windows
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          gem install native-packages --version 0.10.0 --no-document
          native-packages doctor --target ${{ matrix.target }} --defer-recipes
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'rawmakase').version
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          native-packages build --version $version --target ${{ matrix.target }} --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
      - name: Install, run and uninstall
        run: packaging/windows/verify.ps1 "$env:RUNNER_TEMP\windows-packages\packages\${{ matrix.target }}\inno\rawmakase-v$env:VERSION-${{ matrix.arch }}-pc-windows-msvc-setup.exe" $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-packages/packages/${{ matrix.target }}/inno/*.exe
          if-no-files-found: error

  # native-packages' shared workflow installs nfpm and builds the DEB, RPM and
  # AppImage packages and the Homebrew cask. Pull requests package the published v0.1.8
  # x86_64 archive, the last release before aarch64 builds; a release packages
  # its own archives for both architectures.
  packages:
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@226fb48cb375c7cb309a3e642c7228a6e00e9ebf # v0.10.0
    with:
      targets: ${{ inputs.version != '' && 'linux-amd64,linux-arm64' || 'linux-amd64' }}
      version: ${{ inputs.version || 'v0.1.8' }}
      source-artifact: ${{ inputs.source-artifact }}
      publish: false

  install:
    name: Install on ${{ matrix.image }} (${{ matrix.platform.target }})
    needs: packages
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:13-slim, fedora:43, fedora:44]
        platform: ${{ fromJSON(inputs.version != '' && '[{"runner":"ubuntu-24.04","target":"linux-amd64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"}]' || '[{"runner":"ubuntu-24.04","target":"linux-amd64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: native-packages
      - name: Clean installation, runtime libraries and removal
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          mkdir packages
          cp "native-packages/packages/$TARGET/deb/"*.deb "native-packages/packages/$TARGET/rpm/"*.rpm packages/
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/packaging/linux:/checks:ro" "$IMAGE" bash /checks/verify.sh

  # The AppImage on each architecture: its name, layout and licences, then, for
  # a release, starting it. The published 0.1.8 archive pull requests package
  # predates the launcher that resolves AppRun's symlink, so it is not run.
  appimage:
    name: AppImage (${{ matrix.platform.target }})
    needs: packages
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.version != '' && '[{"runner":"ubuntu-24.04","target":"linux-amd64","arch":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64","arch":"aarch64"}]' || '[{"runner":"ubuntu-24.04","target":"linux-amd64","arch":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: native-packages
      - name: Check and run the AppImage
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.platform.target }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          version=${RELEASE_VERSION:-0.1.8}
          run=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            # The host libraries the binary links; Vulkan and the window system load later.
            sudo apt-get update
            sudo apt-get install -y zlib1g
            run=(--run)
          fi
          bash packaging/linux/verify-appimage.sh "native-packages/packages/$TARGET/appimage/rawmakase-$version-$ARCH.AppImage" "$version" "${run[@]}"
