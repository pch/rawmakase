name: Stats

on:
  push:
    branches: [main]
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  pull_request:
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pull requests only test. Deployments share one queue and are never
# cancelled halfway through a migration.
concurrency:
  group: stats-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    working-directory: stats

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test

  # Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without
  # them the job only reports that it skipped deploying.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not set; skipping the stats deploy."
          fi
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.present
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.present
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - if: steps.credentials.outputs.present
        run: npm ci
      - name: Apply migrations and deploy
        if: steps.credentials.outputs.present
        run: npm run deploy
