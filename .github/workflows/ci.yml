name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'stats/**'
      - '.github/workflows/stats.yml'
      - '.github/workflows/codeql.yml'
      - '.github/triage.yml'
      - '.github/workflows/triage.yml'
      - '.github/workflows/workflow-lint.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'stats/**'
      - '.github/workflows/stats.yml'
      - '.github/workflows/codeql.yml'
      - '.github/triage.yml'
      - '.github/workflows/triage.yml'
      - '.github/workflows/workflow-lint.yml'
  workflow_call:
    inputs:
      source-ref:
        description: Exact release source commit to validate
        type: string
        default: ""

permissions:
  contents: read

# A newer push supersedes the run in progress on the same branch. Release
# validation (called with source-ref) gets its own group, so it never queues
# behind or cancels a push run on main, and is never cancelled itself.
concurrency:
  group: ${{ inputs.source-ref && format('ci-release-{0}', inputs.source-ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.source-ref }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep test backtraces readable while cutting build time and the
  # size of the cached target directories. Release builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # The MSRV is compiled in this job as well, which is a second full
    # dependency build, so 45 minutes no longer covers it.
    timeout-minutes: 60
    steps:
      # rustup replaces Arch's rolling rust package: the lints a clippy release
      # adds would otherwise break the lint job on an ordinary day. rustup
      # conflicts with the rust package, so it takes its place here.
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          rustup git libraw lcms2 pkgconf desktop-file-utils perl-image-exiftool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # The stable toolchain AGENTS.md tells contributors to use ("Before every
      # push"), so the lint job and the local checks agree on the lints.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      # Only pushes to main save caches: pull requests restore main's, and
      # release validation would save caches nothing else restores.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      # Compiling the declared MSRV is what makes it a minimum: comparing
      # version strings only proves this job is not older than the claim, and
      # compared nothing at all while Cargo.toml carried no rust-version.
      - name: Build with the minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --all-targets
      - run: cargo fmt --check
      # The model, file formats, the catalog, the protocol crate and the standalone
      # client build without the app's native libraries, wgpu or GUI, and the
      # renderer without the native libraries or GUI; fmt above covers the whole
      # workspace.
      - name: Check the model, file formats, catalog, renderer, control protocol and client
        run: |
          cargo clippy --locked --all-targets -p rawmakase-model -p rawmakase-interop -p rawmakase-catalog -p rawmakase-engine -p rawmakase-protocol -p rawmakase-ctl -- -D warnings
          cargo test --locked -p rawmakase-model --all-features
          cargo test --locked -p rawmakase-interop -p rawmakase-catalog -p rawmakase-engine
          cargo test --locked -p rawmakase-protocol -p rawmakase-ctl
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Packagers can leave out the usage report (Cargo.toml, `telemetry`).
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      # Tests that need private RAW files, camera profiles or a GPU are #[ignore]d.
      # exiftool reads exported metadata back as an independent reader; Arch
      # installs it in vendor_perl, outside PATH.
      - run: PATH="/usr/bin/vendor_perl:$PATH" cargo test --locked -p rawmakase -p rawmakase-native -p rawmakase-export
        env:
          RAWMAKASE_REQUIRE_EXIFTOOL: "1"
      - name: Validate desktop entry
        run: desktop-file-validate packaging/applications/rawmakase.desktop

  check-arm64:
    name: Test on aarch64
    # Arch Linux has no arm64 container image, so this builds LibRaw the way the
    # aarch64 release does.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libjpeg-dev zlib1g-dev libvulkan1 libxkbcommon-dev libwayland-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          bash packaging/native-deps.sh "$RUNNER_TEMP/native"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - name: Test
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/native/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/native/lib"
          export CXXFLAGS="-DCMS_NO_REGISTER_KEYWORD"
          cargo test --locked --workspace

  check-windows:
    name: Test on Windows
    # MSVC with LibRaw and Little CMS from vcpkg (packaging/windows/deps.ps1).
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Fixtures and blessed outputs are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # Release rehearsals of tags from before Windows support skip this job.
      - name: Windows support in this source
        id: source
        shell: bash
        run: echo "windows=$(test -f packaging/windows/deps.ps1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.windows == 'true'
        name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # vcpkg's binary cache; release builds (release.yml) start from scratch.
      # vcpkg's package hashes cover the image's CMake and PowerShell versions,
      # and runners mix image versions during a rollout, so each image version
      # keeps its own cache.
      - if: steps.source.outputs.windows == 'true'
        id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.windows == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('packaging/windows/deps.ps1', 'packaging/windows/vcpkg-ports/**') }}
      - if: steps.source.outputs.windows == 'true'
        name: LibRaw and Little CMS
        run: packaging/windows/deps.ps1 "$env:RUNNER_TEMP\deps"
      - if: steps.source.outputs.windows == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - if: steps.source.outputs.windows == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The catalog commits with synchronous=FULL into tempfile directories.
      # %TEMP% is on C:, the runner's OS disk, where each flush is slow, and
      # Defender scans every file created there: the catalog and library tests
      # ran 10 to 20 times slower than on Linux or macOS. RUNNER_TEMP is on D:.
      - if: steps.source.outputs.windows == 'true'
        name: Temporary files on D:, outside Defender's scan
        run: |
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP", "$env:GITHUB_WORKSPACE"
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # Tests that need private RAW files, camera profiles or a GPU are #[ignore]d.
      - if: steps.source.outputs.windows == 'true'
        run: cargo test --locked --workspace

  # Without this job the macOS-only code is compiled for the first time by
  # release.yml, after the release commit is already on main, so a macOS-only
  # break holds up the release instead of the pull request. Apple Silicon only:
  # the Intel runner is a second runner for the same sources. fmt is
  # platform-independent and runs in the lint job.
  check-macos:
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Dependencies
        run: |
          brew install autoconf automake libtool pkg-config libomp jpeg-turbo
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          # LibRaw and Little CMS are built the way the macOS release builds
          # them (build.rs wants LibRaw >= 0.22); jpeg-turbo is what LibRaw's
          # own build links its JPEG decoder against, as macOS has no libjpeg.
          # build.rs links the OpenMP runtime from LIBOMP_PREFIX.
          jpeg_prefix=$(brew --prefix jpeg-turbo)
          {
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/native/lib/pkgconfig:$jpeg_prefix/lib/pkgconfig"
            echo "CPPFLAGS=-I$jpeg_prefix/include"
            echo "LDFLAGS=-L$jpeg_prefix/lib"
            echo "LIBOMP_PREFIX=$(brew --prefix libomp)"
            # LibRaw's decoders are OpenMP-parallel; Little CMS lost its register
            # keyword to C++17.
            echo "CXXFLAGS=-DCMS_NO_REGISTER_KEYWORD"
            # The test binaries load the libraries built above at run time.
            echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/native/lib:$(brew --prefix libomp)/lib"
          } >> "$GITHUB_ENV"
      # GITHUB_ENV takes effect in the next step, including the JPEG paths
      # needed by LibRaw's configure script.
      - name: Build native dependencies
        run: bash packaging/native-deps.sh "$RUNNER_TEMP/native"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that need private RAW files, camera profiles or a GPU are #[ignore]d.
      - run: cargo test --locked --workspace

  package:
    name: Build, install and run Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed rust git libraw lcms2 pkgconf namcap
          hicolor-icon-theme libxkbcommon vulkan-icd-loader wayland
          libxkbcommon-x11 libx11 libxcb libxcursor libxi libxrandr libglvnd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # makepkg rebuilds its source folder, so the build goes to target-arch outside it,
      # and that and the cargo registry are cached between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-arch"
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - name: makepkg (current checkout)
        run: |
          useradd -m builder
          mkdir -p "$GITHUB_WORKSPACE/target-arch" "$HOME/.cargo"
          chown -R builder "$GITHUB_WORKSPACE" "$HOME/.cargo"
          chmod a+x "$HOME"
          # Build the -git recipe from this checkout rather than the published repository.
          sed -i "s|git+https://github.com/pch/rawmakase.git|git+file://$GITHUB_WORKSPACE|" packaging/arch/rawmakase-git/PKGBUILD
          sed -i "s|export CARGO_TARGET_DIR=target|export CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target-arch|" packaging/arch/rawmakase-git/PKGBUILD
          sed -i "s|make install DESTDIR|make install BIN=$GITHUB_WORKSPACE/target-arch/release/rawmakase DESTDIR|" packaging/arch/rawmakase-git/PKGBUILD
          # The tests already run in the lint job; --nocheck skips a second full build.
          su builder -c "export CARGO_HOME='$HOME/.cargo' && git config --global --add safe.directory '*' && cd packaging/arch/rawmakase-git && makepkg --noconfirm --nocheck"
          namcap packaging/arch/rawmakase-git/PKGBUILD packaging/arch/rawmakase-git/*.pkg.tar.zst
      # The release build's smoke test: install the package and run it.
      - name: Install and run
        run: |
          pacman -U --noconfirm packaging/arch/rawmakase-git/*.pkg.tar.zst
          rawmakase --help
          # The selection runtime is opened lazily, so only loading it shows it works.
          # Release rehearsals of tags whose recipe predates the runtime skip it.
          if grep -q '^_ortver=' packaging/arch/rawmakase-git/PKGBUILD; then
            python -c "import ctypes; ctypes.CDLL('/usr/lib/rawmakase/libonnxruntime.so')"
          fi

  dependencies:
    name: Module dependencies
    # scripts/deps-allowed.txt lists the dependencies between top-level modules;
    # a new one, a listed one the code no longer has, a cycle, or a chain that
    # scripts/deps-closures.txt forbids fails this job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: python3 scripts/deps.py check
      - name: Camera calibration and comparison checks
        run: |
          python3 -m venv /tmp/rawmakase-parity-tests
          /tmp/rawmakase-parity-tests/bin/pip install numpy pillow
          /tmp/rawmakase-parity-tests/bin/python -m unittest discover -s scripts/cameras

  crates:
    name: Crates without native libraries
    # The model, file formats, catalog and control protocol depend on no app,
    # GPU, GUI or native imaging crate, and the renderer on no app, GUI or
    # native imaging crate (scripts/crate-closures.sh); they build and test on
    # a machine with no LibRaw or Little CMS installed. The catalog's bundled
    # SQLite is the one C library they build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: No LibRaw or Little CMS here
        run: |
          if pkg-config --exists libraw || pkg-config --exists lcms2; then
            echo "LibRaw or Little CMS is installed; this job must build without them"
            exit 1
          fi
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: scripts/crate-closures.sh
      - run: cargo test --locked -p rawmakase-model --all-features
      - run: cargo test --locked -p rawmakase-interop -p rawmakase-catalog -p rawmakase-engine -p rawmakase-protocol

  postgres:
    name: Portable catalog SQL
    # The catalog's SQL is written for SQLite and Postgres alike, so a second
    # backend could be added behind catalog::db (issue #341). Every portable
    # statement must prepare against schema.postgres.sql: Postgres parses and
    # type-checks it, with no data and no backend code in the app.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Write the check
        run: cargo test --locked -p rawmakase-catalog writes_the_postgres_check -- --ignored
        env:
          RAWMAKASE_POSTGRES_CHECK: ${{ runner.temp }}/postgres-check.sql
      - name: Prepare every portable statement on Postgres
        run: psql -X -q -f "$RUNNER_TEMP/postgres-check.sql"
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  audit:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
