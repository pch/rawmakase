name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'stats/**'
      - '.github/workflows/stats.yml'
      - '.github/workflows/codeql.yml'
      - '.github/triage.yml'
      - '.github/workflows/triage.yml'
      - '.github/workflows/workflow-lint.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'stats/**'
      - '.github/workflows/stats.yml'
      - '.github/workflows/codeql.yml'
      - '.github/triage.yml'
      - '.github/workflows/triage.yml'
      - '.github/workflows/workflow-lint.yml'
  workflow_call:
    inputs:
      source-ref:
        description: Exact release source commit to validate
        type: string
        default: ""

permissions:
  contents: read

# A newer push supersedes the run in progress on the same branch. Release
# validation (called with source-ref) gets its own group, so it never queues
# behind or cancels a push run on main, and is never cancelled itself.
concurrency:
  group: ${{ inputs.source-ref && format('ci-release-{0}', inputs.source-ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.source-ref }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep test backtraces readable while cutting build time and the
  # size of the cached target directories. Release builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          rust git libraw lcms2 pkgconf desktop-file-utils perl-image-exiftool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # Only pushes to main save caches: pull requests restore main's, and
      # release validation would save caches nothing else restores.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - name: Check minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          have=$(rustc --version | cut -d' ' -f2)
          printf '%s\n%s\n' "$msrv" "$have" | sort -VC || { echo "rustc $have < MSRV $msrv"; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Packagers can leave out the usage report (Cargo.toml, `telemetry`).
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      # Tests that need private RAW files, camera profiles or a GPU are #[ignore]d.
      # exiftool reads exported metadata back as an independent reader; Arch
      # installs it in vendor_perl, outside PATH.
      - run: PATH="/usr/bin/vendor_perl:$PATH" cargo test --locked
        env:
          RAWMAKASE_REQUIRE_EXIFTOOL: "1"
      - name: Validate desktop entry
        run: desktop-file-validate packaging/applications/rawmakase.desktop

  check-arm64:
    name: Test on aarch64
    # Arch Linux has no arm64 container image, so this builds LibRaw the way the
    # aarch64 release does.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libjpeg-dev zlib1g-dev libvulkan1 libxkbcommon-dev libwayland-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          bash packaging/native-deps.sh "$RUNNER_TEMP/native"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - name: Test
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/native/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/native/lib"
          export CXXFLAGS="-DCMS_NO_REGISTER_KEYWORD"
          cargo test --locked

  check-windows:
    name: Test on Windows
    # MSVC with LibRaw and Little CMS from vcpkg (packaging/windows/deps.ps1).
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Fixtures and blessed outputs are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # Release rehearsals of tags from before Windows support skip this job.
      - name: Windows support in this source
        id: source
        shell: bash
        run: echo "windows=$(test -f packaging/windows/deps.ps1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.windows == 'true'
        name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # vcpkg's binary cache; release builds (release.yml) start from scratch.
      # vcpkg's package hashes cover the image's CMake and PowerShell versions,
      # and runners mix image versions during a rollout, so each image version
      # keeps its own cache.
      - if: steps.source.outputs.windows == 'true'
        id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.windows == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ steps.image.outputs.version }}-${{ hashFiles('packaging/windows/deps.ps1') }}
      - if: steps.source.outputs.windows == 'true'
        name: LibRaw and Little CMS
        run: packaging/windows/deps.ps1 "$env:RUNNER_TEMP\deps"
      - if: steps.source.outputs.windows == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - if: steps.source.outputs.windows == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      # Tests that need private RAW files, camera profiles or a GPU are #[ignore]d.
      - if: steps.source.outputs.windows == 'true'
        run: cargo test --locked

  package:
    name: Build, install and run Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed rust git libraw lcms2 pkgconf namcap
          hicolor-icon-theme libxkbcommon vulkan-icd-loader wayland
          libxkbcommon-x11 libx11 libxcb libxcursor libxi libxrandr libglvnd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # makepkg rebuilds its source folder, so the build goes to target-arch outside it,
      # and that and the cargo registry are cached between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-arch"
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.source-ref }}
      - name: makepkg (current checkout)
        run: |
          useradd -m builder
          mkdir -p "$GITHUB_WORKSPACE/target-arch" "$HOME/.cargo"
          chown -R builder "$GITHUB_WORKSPACE" "$HOME/.cargo"
          chmod a+x "$HOME"
          # Build the -git recipe from this checkout rather than the published repository.
          sed -i "s|git+https://github.com/pch/rawmakase.git|git+file://$GITHUB_WORKSPACE|" packaging/arch/rawmakase-git/PKGBUILD
          sed -i "s|export CARGO_TARGET_DIR=target|export CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target-arch|" packaging/arch/rawmakase-git/PKGBUILD
          sed -i "s|make install DESTDIR|make install BIN=$GITHUB_WORKSPACE/target-arch/release/rawmakase DESTDIR|" packaging/arch/rawmakase-git/PKGBUILD
          # The tests already run in the lint job; --nocheck skips a second full build.
          su builder -c "export CARGO_HOME='$HOME/.cargo' && git config --global --add safe.directory '*' && cd packaging/arch/rawmakase-git && makepkg --noconfirm --nocheck"
          namcap packaging/arch/rawmakase-git/PKGBUILD packaging/arch/rawmakase-git/*.pkg.tar.zst
      # The release build's smoke test: install the package and run it.
      - name: Install and run
        run: |
          pacman -U --noconfirm packaging/arch/rawmakase-git/*.pkg.tar.zst
          rawmakase --help

  audit:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
