name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to preview without changing labels or posting comments
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-issue-${{ inputs.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: crmne/copilot-triage@8d7000f426cee56fb60567108ca082d9bc1520a1 # v0.16.1
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          kind: issue
          number: ${{ inputs.number || github.event.issue.number }}
          # Manual runs preview a decision in the job summary; they still use Copilot credits.
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
