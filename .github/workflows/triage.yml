name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to assess
        required: true
        type: string
      dry_run:
        description: Preview without changing labels or posting comments
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: triage-issue-${{ inputs.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    # Persist muted threads and prior replies on issue and comment events.
    cache-mode: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate as RAWmakase Sous Chef
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
      - uses: crmne/copilot-triage@18ecd75dea5e97c8691b0d1853da2a89e849b199 # v0.20.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          engine: rubyllm
          provider: openai
          model: gpt-5.6-luna
          api-key: ${{ secrets.OPENAI_API_KEY }}
          kind: issue
          number: ${{ inputs.number || github.event.issue.number }}
          # Manual runs default to preview; both modes incur API usage.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
