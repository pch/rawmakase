name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build (for example v0.1.1)
        type: string
        required: true
      publish:
        description: Publish the selected stable tag after all package checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable tag and release commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Select a stable vX.Y.Z tag.' >&2; exit 1; }
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git show "$sha:Cargo.toml" > "$RUNNER_TEMP/release-Cargo.toml"
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$RUNNER_TEMP/release-Cargo.toml")
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor "$sha" origin/main
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Require reviewed release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="packaging/release-notes/$RELEASE_TAG.md"
          if ! test -s "$notes" || ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::Write $notes before releasing; generated placeholder notes are not allowed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-notes"
          cp "$notes" "$RUNNER_TEMP/release-notes/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-notes
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error

  # The platform builds run alongside CI rather than after it; publish waits
  # for both, so nothing ships unless CI passed on the exact release commit.
  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}

  linux:
    name: Linux archive (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libjpeg-dev zlib1g-dev patchelf libvulkan1 libxkbcommon-dev libwayland-dev
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          toolchain_bin=$(dirname "$(rustup which --toolchain 1.98.1 rustc)")
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          bash packaging/native-deps.sh "$RUNNER_TEMP/native"
      - name: Build and stage portable payload
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/native/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/native/lib"
          export CXXFLAGS="-DCMS_NO_REGISTER_KEYWORD"
          cargo build --release --locked --manifest-path release-source/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          python3 packaging/linux/bundle.py target/release/rawmakase dist/linux-root "$RUNNER_TEMP/native"
          mkdir -p dist/upload
          tar -C dist/linux-root -czf "dist/upload/rawmakase-$VERSION-$ARCH-linux.tar.gz" usr
          # Both architectures bundle the same library sources; publish them once.
          if [[ "$TARGET" = linux-amd64 ]]; then
            mkdir -p "$RUNNER_TEMP/native-sources/build"
            cp "$RUNNER_TEMP/native/sources/"* "$RUNNER_TEMP/native-sources/"
            cp packaging/native-deps.sh "$RUNNER_TEMP/native-sources/build/"
            tar -C "$RUNNER_TEMP/native-sources" -czf "dist/upload/rawmakase-$VERSION-native-sources.tar.gz" .
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/upload/*
          if-no-files-found: error

  arch:
    name: Arch package and source recipe
    needs: prepare
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Dependencies
        run: >-
          pacman -Syu --noconfirm --needed rust git libraw lcms2 pkgconf
          hicolor-icon-theme libxkbcommon vulkan-icd-loader wayland namcap
          libxkbcommon-x11 libx11 libxcb libxcursor libxi libxrandr libglvnd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from the exact tagged source archive
        run: |
          mkdir -p dist/upload dist/arch
          curl --fail --location --retry 3 "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz" -o "dist/arch/rawmakase-$VERSION.tar.gz"
          sum=$(sha256sum "dist/arch/rawmakase-$VERSION.tar.gz" | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/arch/rawmakase/PKGBUILD > dist/arch/PKGBUILD
          useradd -m builder
          chown -R builder dist
          # CI runs the tests on this exact commit; check() stays in the recipe
          # for anyone building it themselves.
          su builder -c "cd '$GITHUB_WORKSPACE/dist/arch' && makepkg --noconfirm --nocheck && makepkg --printsrcinfo > .SRCINFO"
          namcap dist/arch/PKGBUILD dist/arch/*.pkg.tar.zst
          pacman -U --noconfirm dist/arch/*.pkg.tar.zst
          rawmakase --version
          pacman -R --noconfirm rawmakase
          cp dist/arch/*.pkg.tar.zst dist/upload/
          cp "dist/arch/rawmakase-$VERSION.tar.gz" "dist/upload/rawmakase-$VERSION-source.tar.gz"
          tar -C dist/arch -czf "dist/upload/rawmakase-$VERSION-arch-recipe.tar.gz" PKGBUILD .SRCINFO
          # AUR pushes are intentionally disabled. GitHub is the distribution channel.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-arch
          path: dist/upload/*
          if-no-files-found: error

  macos-icon:
    name: Compile macOS icon
    needs: prepare
    # Icon Composer's asset runtime crashes on macOS 15. Compile only the
    # architecture-independent icon here; keep binaries/libraries on macOS 15.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test icon packaging
        run: python3 -m unittest discover -s packaging/macos -p 'test_*.py'
      - name: Compile the Liquid Glass icon
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          xcodebuild -version
          mkdir -p compiled-icon
          xcrun actool packaging/macos/RAWmakase.icon --compile compiled-icon \
            --app-icon RAWmakase --platform macosx --minimum-deployment-target 15.0 \
            --output-partial-info-plist compiled-icon/partial.plist
          test -s compiled-icon/Assets.car
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-icon
          path: compiled-icon/Assets.car
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [prepare, macos-icon]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: macos-arm64
          - runner: macos-15-intel
            arch: x86_64
            target: macos-amd64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Download the compiled Liquid Glass icon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-icon
          path: compiled-icon
      - name: Build dependencies and app
        run: |
          brew install pkg-config libomp jpeg-turbo librsvg
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          toolchain_bin=$(dirname "$(rustup which --toolchain 1.98.1 rustc)")
          export PATH="$toolchain_bin:$PATH"
          jpeg_prefix=$(brew --prefix jpeg-turbo)
          export PKG_CONFIG_PATH="$jpeg_prefix/lib/pkgconfig"
          export CPPFLAGS="-I$jpeg_prefix/include"
          export LDFLAGS="-L$jpeg_prefix/lib"
          bash packaging/native-deps.sh "$RUNNER_TEMP/native"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/native/lib/pkgconfig:$PKG_CONFIG_PATH"
          LIBOMP_PREFIX=$(brew --prefix libomp)
          export LIBOMP_PREFIX
          export CXXFLAGS="-DCMS_NO_REGISTER_KEYWORD"
          cargo build --release --locked --manifest-path release-source/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          python3 packaging/macos/bundle.py target/release/rawmakase dist/RAWmakase.app "$VERSION" "$RUNNER_TEMP/native" --minimum-macos "$MACOSX_DEPLOYMENT_TARGET" --icon-assets compiled-icon/Assets.car
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Sign and notarize DMG
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          for key in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!key}" || { echo "Missing repository secret: $key" >&2; exit 1; }
          done
          gem install native-packages --version 0.7.0 --no-document
          # The cask is rendered later, once both DMGs exist.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          ruby packaging/macos/signing-diagnostics.rb build --version "$VERSION" --target "$TARGET" --defer-recipes --output "$RUNNER_TEMP/macos-packages"
          mkdir -p dist/upload
          cp "$RUNNER_TEMP/macos-packages/packages/$TARGET/dmg/"*.dmg dist/upload/
      - name: Verify the finished download
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packaging/macos/verify.sh "dist/upload/rawmakase-v$VERSION-macos-$ARCH.dmg" "$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/upload/*
          if-no-files-found: error

  windows:
    name: Windows installer and archive (x86_64)
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: release-source
          persist-credentials: false
      # Tags from before Windows support (v0.1.8 and earlier) cannot build
      # for Windows; a rehearsal or rebuild of one skips this job's work.
      - name: Windows support in the release source
        id: source
        shell: bash
        run: echo "windows=$(test -f release-source/packaging/windows/deps.ps1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.windows == 'true'
        name: Build dependencies and app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          packaging/windows/deps.ps1 "$env:RUNNER_TEMP\deps"
          cargo build --release --locked --manifest-path release-source/Cargo.toml --target-dir "$env:GITHUB_WORKSPACE\target"
          packaging/windows/stage.ps1 target\release\rawmakase.exe "$env:RUNNER_TEMP\deps" dist\windows
      - if: steps.source.outputs.windows == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - if: steps.source.outputs.windows == 'true'
        name: Installer and portable archive
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          gem install native-packages --version 0.7.0 --no-document
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          native-packages build --version $env:VERSION --target windows-amd64 --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          New-Item -ItemType Directory dist\upload | Out-Null
          Copy-Item "$env:RUNNER_TEMP\windows-packages\packages\windows-amd64\inno\*.exe" dist\upload\
          # The portable archive has no updater marker: like the Linux archive,
          # it is told about new releases rather than replacing itself.
          $name = "rawmakase-v$env:VERSION-x86_64-pc-windows-msvc"
          Copy-Item dist\windows "dist\$name" -Recurse
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\upload\$name.zip"
      - if: steps.source.outputs.windows == 'true'
        name: Verify the finished download
        run: packaging/windows/verify.ps1 "dist\upload\rawmakase-v$env:VERSION-x86_64-pc-windows-msvc-setup.exe" $env:VERSION
      - if: steps.source.outputs.windows == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-amd64
          path: dist/upload/*
          if-no-files-found: error

  # native-packages' shared workflow turns the Linux archives into DEB and RPM
  # packages and renders the Homebrew cask from the notarized DMGs, then checks
  # the packages install cleanly, all before anything is published.
  package-inputs:
    name: Gather packaging inputs
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-inputs
          path: |
            dist/*-linux.tar.gz
            dist/*.dmg
          if-no-files-found: error

  packages:
    needs: [prepare, package-inputs]
    permissions:
      contents: write
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source-artifact: package-inputs

  publish:
    name: Publish verified packages
    needs: [prepare, ci, linux, arch, macos, windows, packages]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds RAWMAKASE_UPDATE_SIGNING_KEY; v* tags and manual main rebuilds need approval.
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-notes
          path: release-notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-packages
          path: native-packages
      - name: Add the DEB and RPM packages and the Homebrew cask
        run: cp native-packages/packages/*/deb/*.deb native-packages/packages/*/rpm/*.rpm native-packages/recipes/homebrew/rawmakase.rb dist/
      - name: Final checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: release-source
          sparse-checkout: assets
          persist-credentials: false
      # checksums.txt and its Ed25519 signature, which the app's updater
      # verifies against assets/update-public-key.hex before installing.
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
        with:
          directory: dist
          public-key: release-source/assets/update-public-key.hex
          key-env: RAWMAKASE_UPDATE_SIGNING_KEY
        env:
          RAWMAKASE_UPDATE_SIGNING_KEY: ${{ secrets.RAWMAKASE_UPDATE_SIGNING_KEY }}
      - name: Attest packages
        uses: crmne/native-packages/.github/actions/attest@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
        with:
          subject-path: dist/*
      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes/notes.md
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "RAWmakase ${RELEASE_TAG#v}" --notes-file release-notes/notes.md

  website:
    name: Update website downloads
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      after-release: true

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish]
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
