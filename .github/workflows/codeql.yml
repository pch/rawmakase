name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - '**.md'
  schedule:
    - cron: '23 7 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Preserve the languages and weekly coverage of GitHub's default
        # setup, while allowing website-only changes to skip these jobs.
        # No C or C++ is left to analyse since the LibRaw bridge went (#526).
        language: [actions, python, ruby, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
