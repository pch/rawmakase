name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      after-release:
        description: Rebuild the main-branch website after publishing app downloads
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests only build. Production deployments share one queue, including
# calls from the release workflow, so two builds cannot publish simultaneously.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Releases refresh download links using the current website, even
          # when rebuilding an older app tag. PRs build their merge commit.
          ref: ${{ inputs.after-release && 'main' || github.sha }}
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.150.1'
          extended: true
      - name: Build website
        run: hugo --source website --minify --panicOnWarning
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.after-release)
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.after-release)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
