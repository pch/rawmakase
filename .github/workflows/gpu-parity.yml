name: GPU parity

# The GPU port must keep matching the CPU renderer. Its tests need a hardware
# compute adapter, so CI's test jobs skip them (#[ignore]); this lane runs them
# on pull requests that can change what either renders, weekly against main,
# and on demand. A pull request that fails it changed GPU or CPU output apart
# (#808, decision 2).
on:
  pull_request:
    paths:
      # The renderer, CPU and GPU (pipeline, shaders, stages).
      - 'crates/rawmakase-engine/src/develop/**'
      # The model's colour, profile and optics maths both renderers read, and
      # what the GPU repeats in its shaders: the lens tables (optics), the
      # clipping overlay and histogram (rendered.rs), profile adjustments
      # (recipe.rs).
      - 'crates/rawmakase-model/src/color/**'
      - 'crates/rawmakase-model/src/camera_profiles/**'
      - 'crates/rawmakase-model/src/optics/**'
      - 'crates/rawmakase-model/src/rendered.rs'
      - 'crates/rawmakase-model/src/model/recipe.rs'
      - 'crates/rawmakase-model/src/model/white_balance.rs'
      # wgpu: where it is declared, and the version Cargo.lock resolves.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/rawmakase-engine/Cargo.toml'
      - '.github/workflows/gpu-parity.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request (or branch) supersedes its run.
concurrency:
  group: gpu-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: GPU matches CPU
    # Apple Silicon runners expose a Metal device to the virtual machine.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Its own cache, saved by the weekly and on-demand runs on main so each
      # builds only what changed; other runs restore it without saving.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Show the GPU
        run: system_profiler SPDisplaysDataType
      # Only the GPU tests: the other ignored tests need private RAW files,
      # catalogs or camera profiles. The workspace build, not `-p rawmakase-engine`:
      # the engine alone builds wgpu without a platform backend (its dependency
      # graph has no `metal`), and the tests panic at instance creation. The
      # app crate's eframe pulls the feature in, and the filter still selects
      # only develop::gpu. installed_zoom_profile_cpu_gpu_agree is skipped: it
      # also needs a local Adobe LCP (RAWMAKASE_LCP), which the runner lacks.
      - name: GPU tests
        run: >-
          cargo test --locked --workspace develop::gpu -- --ignored --test-threads=1
          --skip installed_zoom_profile_cpu_gpu_agree
