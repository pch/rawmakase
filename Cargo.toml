[package]
name = "rawmakase"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
description = "A fast, non-destructive RAW photo developer"
license = "MIT"
repository = "https://github.com/pch/rawmakase"

[dependencies]
anyhow = "1"
flate2 = "1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1.12"
bytemuck = "1.25"
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11.3"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.17.2"
# The HTTP client behind fastframe-update; rustls with bundled roots needs no
# system TLS library.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Shared egui app foundation (github.com/crmne/fastframe). Not on crates.io
# yet: pin a tag and update it deliberately.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }
# The SVG loader behind the icons, at eframe's egui version.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", version = "0.1.7" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
