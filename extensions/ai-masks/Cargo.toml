[package]
name = "rawmakase-ai-masks"
# The bundled extension's manifest carries the app's version, and so does this
# program (a test compares them).
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
description = "Select Subject, Sky and Background for RAWmakase, as a bundled extension: the selection models, here or on a remote worker"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rawmakase-ai-masks"
path = "src/main.rs"

[dependencies]
rawmakase-cancel = { path = "../../crates/rawmakase-cancel", version = "0.1.0" }
rawmakase-extension = { path = "../../crates/rawmakase-extension", version = "0.1.0" }
rawmakase-inference = { path = "../../crates/rawmakase-inference", version = "0.1.0" }
rawmakase-model-install = { path = "../../crates/rawmakase-model-install", version = "0.1.0" }
rawmakase-protocol = { path = "../../crates/rawmakase-protocol", version = "0.1.0" }
rawmakase-remote = { path = "../../crates/rawmakase-remote", version = "0.1.0" }
rawmakase-selection = { path = "../../crates/rawmakase-selection", version = "0.1.0" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
