[package]
name = "rawmakase-interop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's file formats and presets over its model: XMP, Lightroom Develop settings, presets, raw defaults, EXIF, watermarks, and which edit a photo develops with, without the RAW decoders, the renderer or the GUI"
license.workspace = true
publish = false

[features]
# The model's fixtures, for tests that share them.
test-support = ["rawmakase-model/test-support"]

[dependencies]
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
anyhow.workspace = true
# The Exif and XMP boxes JPEG XL files keep brotli-compressed.
brotli-decompressor = "6.1.1"
roxmltree.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
tempfile.workspace = true
# The Desktop and Pictures folders export settings default to: XDG user
# folders on Linux, the shell's known folders on Windows. Already in the app
# through fastframe.
directories = "6"

[dev-dependencies]
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
