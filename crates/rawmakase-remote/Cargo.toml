[package]
name = "rawmakase-remote"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Optional remote inference for RAWmakase's selection models: a small TCP worker that runs them where the GPU is, and the client the app talks to"
license.workspace = true
publish = false

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
rawmakase-inference = { path = "../rawmakase-inference", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Pixels and coverage ride inside the JSON frames as base64.
base64.workspace = true

[dev-dependencies]
# The real-photo test decodes an sRGB JPEG the caller names; the app itself
# never decodes through this crate.
# Only JPEG: the worker needs none of the workspace's other formats.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Nothing beyond the above: the tests run the real server and client against a
# fake engine on a loopback port.

[[bin]]
name = "rawmakase-remote-worker"
path = "src/bin/worker.rs"

[lints]
workspace = true
