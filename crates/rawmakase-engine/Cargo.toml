[package]
name = "rawmakase-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's renderer: developing a decoded image with a recipe on the CPU, and the GPU preview port, without the file formats, the RAW decoders, the catalog or the GUI"
license.workspace = true
publish = false

[features]
# Helpers the app's own tests build on.
test-support = ["rawmakase-model/test-support"]

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
anyhow.workspace = true
bytemuck.workspace = true
image.workspace = true
pollster = "1"
rayon.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[dev-dependencies]
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0", features = ["test-support"] }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
