[package]
name = "rawmakase-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's catalog: photos, folders, collections and edits in SQLite, and Lightroom import, without the RAW decoders, the renderer or the GUI"
license.workspace = true
publish = false

[features]
# The file system's, model's and file formats' fixtures, for tests that share them.
test-support = ["rawmakase-fs/test-support", "rawmakase-model/test-support", "rawmakase-interop/test-support"]

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
rawmakase-fs = { path = "../rawmakase-fs", version = "0.1.0" }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
anyhow.workspace = true
flate2.workspace = true
getrandom.workspace = true
image.workspace = true
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
tempfile.workspace = true

[dev-dependencies]
# Counting commits, for the throughput tests.
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
rawmakase-fs = { path = "../rawmakase-fs", version = "0.1.0", features = ["test-support"] }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0", features = ["test-support"] }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
