[package]
name = "rawmakase-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's catalog: photos, folders, collections and edits in SQLite, and importing an importer's plan, without the RAW decoders, the renderer or the GUI"
license.workspace = true
publish = false

[features]
# The file system's, model's and file formats' fixtures, for tests that share them.
test-support = ["rawmakase-fs/test-support", "rawmakase-model/test-support", "rawmakase-interop/test-support"]

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
# The schema of the plan an extension's importer writes, which the catalog
# imports (`catalog::plan_import`).
rawmakase-extension-protocol = { path = "../rawmakase-extension-protocol", version = "0.1.0" }
rawmakase-fs = { path = "../rawmakase-fs", version = "0.1.0" }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
anyhow.workspace = true
flate2.workspace = true
getrandom.workspace = true
image.workspace = true
# `hooks` and `limits`: an import plan, a file another program wrote, is
# read on a connection with a cancel check and resource limits.
rusqlite = { version = "0.41.0", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
tempfile.workspace = true

[dev-dependencies]
rawmakase-fs = { path = "../rawmakase-fs", version = "0.1.0", features = ["test-support"] }
# Lightroom catalogs are imported in tests with the bundled Lightroom
# extension's plan, as the app imports them.
rawmakase-lightroom = { path = "../../extensions/lightroom", version = "0.6.0", features = ["test-support"] }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0", features = ["test-support"] }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
