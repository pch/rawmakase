[package]
name = "rawmakase-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "RAWmakase's native boundary: LibRaw through a small C++ bridge, colour management, RAWmakase's own demosaicing, opening a photo and its full-size decode with the decode cache"
license = "MIT"
publish = false
# The C++ bridge to LibRaw is built and linked here, so only crates
# that depend on this one link it.
build = "build.rs"

[features]
# The model's fixtures, for tests that share them.
test-support = ["rawmakase-model/test-support", "rawmakase-engine/test-support"]

[dependencies]
rawmakase-engine = { path = "../rawmakase-engine", version = "0.1.0" }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
# RAWmakase's own RAW decoders; until they replace LibRaw, only the commands
# that compare decoders reach them (raw::Decoder::Own).
rawmakase-raw = { path = "../rawmakase-raw", version = "0.1.0" }
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
image.workspace = true
# Colour management of JPEG, PNG and TIFF files, in pure Rust; the version `image` uses.
moxcms = { version = "0.8.1", features = ["options"] }
rayon = "1.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Decode fingerprints hash the unpacked sensor data.
sha2 = "0.11"
tempfile = "3"

# Background threads' scheduling priority (raw::spawn_background).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
