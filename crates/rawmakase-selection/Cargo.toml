[package]
name = "rawmakase-selection"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local ONNX selection models for RAWmakase: Subject, Background and Sky, from pixels to coverage"
license.workspace = true
publish = false

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
# The ONNX Runtime loader, the session helpers, ModelFile and InferenceError.
rawmakase-inference = { path = "../rawmakase-inference", version = "0.1.0" }
# The same release as rawmakase-inference's, which opens the runtime library:
# `load-dynamic` links none. The provider features (`cuda`, `coreml`) are
# rawmakase-inference's, where the providers are registered.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }

[lints]
workspace = true
