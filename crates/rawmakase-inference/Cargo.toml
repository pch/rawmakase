[package]
name = "rawmakase-inference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local ONNX inference for RAWmakase's automatic subject selection: the pinned model contract, pre/post-processing and a lazily loaded ONNX Runtime"
license.workspace = true
publish = false

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
# `load-dynamic` links no ONNX Runtime at build time: the library is opened at
# run time from a path we choose (see `runtime`), so a missing runtime is an
# error value, not a startup failure. Default features would pull in
# `download-binaries`-style build scripts; none of them are wanted. The `cuda`
# and `coreml` features add nothing to link under `load-dynamic`; they compile
# in the code that registers those providers with whatever runtime library was
# opened, which fails with a real error when it cannot.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "coreml"] }

[dev-dependencies]
# The credit file's digest is checked against the manifest's text.
sha2.workspace = true

[lints]
workspace = true
