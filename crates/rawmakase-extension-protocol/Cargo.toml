[package]
name = "rawmakase-extension-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What RAWmakase and its extensions agree on: the manifest, the messages, their framing and the host-drawn controls"
license.workspace = true
repository = "https://github.com/pch/rawmakase"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
# Extension versions and the `rawmakase` range a manifest states.
semver = { version = "1", features = ["serde"] }
# The manifest's JSON Schema (docs/extensions/manifest.schema.json).
schemars = "1.2"

[lints]
workspace = true

[dev-dependencies]
# The tests write a manifest back out.
toml = { workspace = true, features = ["display"] }
