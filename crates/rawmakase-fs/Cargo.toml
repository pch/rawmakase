[package]
name = "rawmakase-fs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What moving a user's file needs of the file system, policy-free: exclusive renames, file ids, exact listings, name comparison, containment, volume facts and a copy's steps, one file per system"
license.workspace = true
publish = false

[features]
# `FileId::elsewhere`, `FileId::numbered` and `set_extra`, for tests that need
# two volumes on one, a volume renumbering its files, or a file's extras.
test-support = []

[dependencies]
sha2.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
# pathconf(_PC_CASE_SENSITIVE) and MNT_LOCAL, which rustix doesn't reach.
libc.workspace = true
# The exclusive rename (renameat2, renameatx_np) and the volume queries,
# without hand-written FFI.
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# MoveFileExW without replacing, file ids and volume facts.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_InstallableFileSystems", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
