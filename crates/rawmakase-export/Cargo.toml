[package]
name = "rawmakase-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's export: developing photos with the renderer and writing JPEG, TIFF and PNG files with their metadata and watermarks, without the GUI"
license.workspace = true
publish = false

[features]
# Helpers the app's own tests build on.
test-support = ["rawmakase-model/test-support", "rawmakase-interop/test-support", "rawmakase-engine/test-support", "rawmakase-decode/test-support"]

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
rawmakase-engine = { path = "../rawmakase-engine", version = "0.1.0" }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
rawmakase-decode = { path = "../rawmakase-decode", version = "0.1.0" }
anyhow.workspace = true
image.workspace = true
# The GUID of ExtendedXMP in JPEG exports is an MD5.
md-5.workspace = true
# Installed fonts for text watermarks are mapped, not read whole.
memmap2 = "0.9"
# PNG exports, with XMP in an iTXt chunk, which image's encoder cannot write.
png = "0.18.1"
roxmltree.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
# Glyph outlines for text watermarks.
skrifa = "0.49"
tempfile.workspace = true
tiff.workspace = true
unicode-normalization.workspace = true
# JPEG XL exports: lossless modular encoding in pure Rust; RAWmakase writes the
# image header (colour encoding, tone mapping) and the container itself.
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std", "threads"] }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
# Lossy JPEG XL exports: a pure-Rust VarDCT encoder (a port of libjxl-tiny).
# Pinned exactly: it is young and its API changes between releases, so each
# upgrade is reviewed (docs/dependencies.md). Without its default features it
# leaves out the metric crates and the experimental splines; the SIMD paths are
# chosen at run time.
jixel = { version = "=0.5.7", default-features = false, features = ["neon", "sse", "avx"] }
# Inter and the installed-font directories for text watermarks. It is built for
# egui and brings egui along, though nothing here draws with it.
fastframe-fonts.workspace = true

[dev-dependencies]
# An independent decoder for JPEG XL exports.
jxl-oxide = { version = "0.12.6", default-features = false }
rawmakase-catalog = { path = "../rawmakase-catalog", version = "0.1.0", features = ["test-support"] }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0", features = ["test-support"] }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }
# Fingerprints of the recorded sRGB exports.
sha2.workspace = true
# Reads wide-gamut exports back through their embedded profiles.
moxcms = "0.8.1"

[lints]
workspace = true
