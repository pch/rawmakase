[package]
name = "rawmakase-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "What a RAWmakase edit is, as values: recipes, camera and lens profiles, colour and output buffers, without the RAW decoders, the renderer or the GUI"
license = "MIT"
publish = false

[features]
# Fixtures and helpers the app's own tests build on.
test-support = []

[dependencies]
rawmakase-protocol = { path = "../rawmakase-protocol", version = "0.1.0" }
rawmakase-tiff = { path = "../rawmakase-tiff", version = "0.1.0" }
anyhow = "1"
flate2 = "1"
# Names a look's RGB table, as Adobe names tables (`Table_<md5>`).
md-5 = "0.11"
sha2 = "0.11"
unicode-normalization = "0.1"
rayon = "1.12"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
# ENOTSUP, which exFAT on macOS answers an exclusive rename with, and
# pathconf(_PC_CASE_SENSITIVE), which rustix doesn't reach.
libc = "0.2"
# `storage::fsops`: the exclusive rename (renameat2, renameatx_np) and the
# volume queries, without hand-written FFI.
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# `storage::fsops`: MoveFileExW without replacing, file ids and volume facts.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_InstallableFileSystems", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }
