[package]
name = "rawmakase-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What a RAWmakase edit is, as values: recipes, camera and lens profiles, colour and output buffers, without the RAW decoders, the renderer or the GUI"
license.workspace = true
publish = false

[features]
# Fixtures and helpers the app's own tests build on.
test-support = []

[dependencies]
rawmakase-protocol = { path = "../rawmakase-protocol", version = "0.1.0" }
rawmakase-tiff = { path = "../rawmakase-tiff", version = "0.1.0" }
anyhow.workspace = true
flate2.workspace = true
# Names a look's RGB table, as Adobe names tables (`Table_<md5>`).
md-5.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
rayon.workspace = true
roxmltree.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# ENOTSUP, which exFAT on macOS answers an exclusive rename with.
libc.workspace = true

[lints]
workspace = true
