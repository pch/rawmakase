[package]
name = "rawmakase-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "What a RAWmakase edit is, as values: recipes, camera and lens profiles, colour and output buffers, without LibRaw, the renderer or the GUI"
license = "MIT"
publish = false

[features]
# Fixtures and helpers the app's own tests build on.
test-support = []

[dependencies]
rawmakase-protocol = { path = "../rawmakase-protocol", version = "0.1.0" }
rawmakase-tiff = { path = "../rawmakase-tiff", version = "0.1.0" }
anyhow = "1"
flate2 = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
rayon = "1.12"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
