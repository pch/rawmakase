[package]
name = "rawmakase-decode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RAWmakase's native boundary: RAW files through RAWmakase's own decoders, colour management, RAWmakase's own demosaicing, opening a photo and its full-size decode with the decode cache"
license.workspace = true
publish = false

[features]
# The model's fixtures, for tests that share them.
test-support = ["rawmakase-model/test-support", "rawmakase-engine/test-support"]

[dependencies]
rawmakase-cancel = { path = "../rawmakase-cancel", version = "0.1.0" }
rawmakase-engine = { path = "../rawmakase-engine", version = "0.1.0" }
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
# RAWmakase's own RAW decoders, reached through the raw adapter (raw::own).
rawmakase-raw = { path = "../rawmakase-raw", version = "0.1.0" }
anyhow.workspace = true
# AI Denoise results are cached at half precision.
half = "2.7"
bytemuck.workspace = true
image.workspace = true
# JPEG XL, in pure Rust; through its `image` decoder.
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image", "rayon"] }
# AVIF: AV1 in pure Rust, with its assembly off so the build needs no nasm.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# AV1's YUV to RGB, in pure Rust.
yuv = "0.8.19"
# The errno rav1d's C interface returns.
libc.workspace = true
# Colour management of JPEG, PNG and TIFF files, in pure Rust; the version `image` uses.
moxcms = { version = "0.8.1", features = ["options"] }
rayon.workspace = true
# A TIFF's ICC profile, which `image` drops from a small image (`raster::tiff_icc`);
# the version `image` decodes TIFFs with, in pure Rust.
tiff.workspace = true
# A PNG's cICP and animation control, which `image` doesn't report
# (`raster::png_facts`); the version `image` decodes PNGs with, in pure Rust.
png = "0.18.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
# Decode fingerprints hash the unpacked sensor data.
sha2.workspace = true
tempfile.workspace = true

# HEIC decoded by the system's ImageIO, drawn by CoreGraphics, in an
# autorelease pool (objc2, the version the app builds).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

# Background threads' scheduling priority (raw::spawn_background).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
# HEIC decoded by Windows Imaging Component, a COM API windows-sys has no
# vtables for; the version the app builds.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

[dev-dependencies]
rawmakase-raw = { path = "../rawmakase-raw", version = "0.1.0", features = ["test-support"] }
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
